<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Droga wojownika">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Droga wojownika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: kinowy, motywujący, ciepły – prezent dla 11-letniej zawodniczki kyokushin
   IDEA: plakat filmowy + karta postaci z gry; trener, który ogląda jej filmy i chwali
   PICTURE: żywy awatar (wideo) na górze każdej zakładki, po dotknięciu otwiera kartę postaci
   COLOUR and TYPE: noc dojo #07090d, złoto pucharów #f2c14e, błękit jej pasa; Barlow Condensed italic + Barlow
   LAYOUT: aplikacja mobilna, dolna nawigacja, jedna kolumna do 640px, pełnoekranowe celebracje */
:root{color-scheme:dark;--acc:#f2c14e;--acc2:#ffe08a;--bg:#07090d;--card:#11141b;--card2:#171b24;--ink:#f1f2f4;--mute:#9aa2af;--line:#252a36;--gold:#f2c14e;--gold2:#ffe08a;--blue:#3b7be8;--red:#e2452b;--green:#2fb36a;--silver:#c4c9cf;--bronze:#c98a4b}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(68px + env(safe-area-inset-bottom));
 background:radial-gradient(circle at 12% 18%,rgba(242,193,78,.07),transparent 28%),radial-gradient(circle at 88% 60%,rgba(59,123,232,.08),transparent 30%),var(--bg);background-attachment:fixed}
h1,h2,h3,.num{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(38px,11vw,52px);font-style:italic;font-weight:800;text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.7)}
h2{font-size:30px;margin-bottom:10px}h3{font-size:22px;margin-bottom:10px}
p{margin:0 0 8px}a{color:inherit}
.wrap{max-width:640px;margin:0 auto}
main{padding:16px}
.kick{color:var(--acc);font-weight:600;font-size:14px;margin:0 0 2px}
.mute{color:var(--mute);font-size:14px}
/* hero z wideo */
.hero{position:relative;max-width:640px;margin:0 auto;cursor:pointer}
.hmedia{aspect-ratio:1/1;max-height:66vh;overflow:hidden;background:#05070b}
.hero.small .hmedia{max-height:46vh}
.hmedia video,.hmedia img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.htext{position:absolute;left:0;right:0;bottom:0;padding:90px 18px 14px;background:linear-gradient(to bottom,transparent,rgba(7,9,13,.75) 45%,var(--bg))}
.ht{font:700 23px/1.15 'Barlow Condensed',sans-serif;margin:6px 0 2px}.hs{color:#c9ced6;margin:0}
.pill{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));background:rgba(5,7,11,.7);border:1px solid rgba(242,193,78,.55);color:var(--gold2);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
/* elementy */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;display:block;text-decoration:none;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .num{font-size:34px;color:var(--acc)}.stat span{display:block;font-size:13px;color:var(--mute);line-height:1.25}
.bar{height:10px;border-radius:6px;background:#232835;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.beltfig{height:84px;margin:6px -6px 0}.beltfig svg{width:100%;height:100%;display:block}
button{font:inherit;font-weight:500;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:0 14px;cursor:pointer}
button:active{transform:scale(.97)}
.btn-p{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:#1a1405;font-weight:700}
.btn-b{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.full{width:100%}.bigbtn{min-height:56px;font-size:19px}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#0b0e14;color:var(--ink);padding:8px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;color:var(--mute);margin:0 0 4px}
.field{margin-bottom:10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chip{min-height:38px;border-radius:99px;font-size:15px;padding:0 14px}.chip.on{background:var(--acc);color:#10131a;border-color:var(--acc);font-weight:700}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}.seg button{flex:none}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0;padding-top:0}
.kname{font-weight:600;font-size:18px}
.stars{display:flex}.stars button{min-height:40px;width:38px;padding:0;border:0;background:none;font-size:26px;line-height:1;color:#323846}.stars button.on{color:var(--gold);text-shadow:0 0 10px rgba(242,193,78,.5)}
.sstars{color:var(--gold);font-size:22px;letter-spacing:2px}.sstars i{color:#323846;font-style:normal}
.tag{font-size:12px;font-weight:700;background:var(--gold);color:#1a1405;border-radius:99px;padding:2px 9px}
details summary{cursor:pointer;color:var(--mute);font-size:14px;min-height:34px;display:flex;align-items:center}
.timer{text-align:center}.timer .num{font-size:clamp(84px,27vw,132px);font-variant-numeric:tabular-nums;margin:4px 0 8px}
.ph-walka .num{color:var(--red)}.ph-przerwa .num{color:var(--blue)}.ph-done .num{color:var(--gold)}
.react{min-height:190px;display:grid;place-items:center;text-align:center;font:800 italic clamp(30px,9vw,50px)/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;background:#05070b;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.react.flash{animation:fl .35s}
@keyframes fl{from{background:var(--gold);color:#1a1405}to{background:#05070b}}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}td:first-child{white-space:nowrap}
.medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 18px 'Barlow Condensed',sans-serif;flex:none;background:#2a2f3a;color:var(--mute)}
.m1{background:radial-gradient(circle at 35% 30%,#fff3b8,#e8bb35 55%,#a87a12);color:#1a1405}.m2{background:radial-gradient(circle at 35% 30%,#fff,#c4c9cf 55%,#7d838b);color:#1a1405}.m3{background:radial-gradient(circle at 35% 30%,#ffd9b0,#c98a4b 55%,#7d4f22);color:#1a1405}
.swatch{width:42px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.25);flex:none;position:relative;overflow:hidden}
.swatch b{position:absolute;left:8px;top:0;bottom:0;width:6px}
.cur{outline:2px solid var(--gold);outline-offset:3px}
.check{display:flex;gap:12px;align-items:center;min-height:44px}
.check input{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--gold)}.check span{flex:1}
.x{min-height:36px;width:36px;padding:0;color:var(--mute);border-color:transparent;background:none;font-size:20px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;min-height:50px}
.opt.ok{background:var(--green);border-color:var(--green);color:#fff}.opt.bad{background:var(--red);border-color:var(--red);color:#fff}
.ok-msg{color:var(--green);font-weight:600;font-size:14px}
.teaser{display:flex;gap:14px;align-items:center}
.teaser img{width:84px;height:84px;border-radius:14px;object-fit:cover;flex:none}
/* tygodniowy wykres */
.weeks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:150px;margin-top:8px}
.weeks div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.weeks i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--gold2),var(--gold));min-height:3px}
.weeks i.z{background:#232835}
.weeks b{font-size:13px;color:var(--gold2)}.weeks span{font-size:11px;color:var(--mute);white-space:nowrap}
/* trener */
.drills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dr{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;display:block;width:100%;position:relative}
.dr img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 25%;display:block}
.dr .t{padding:10px 12px 12px}.dr b{display:block;font:700 19px/1.1 'Barlow Condensed',sans-serif}.dr .mute{font-size:13px;line-height:1.3}
.dr .best{position:absolute;right:8px;top:8px;background:rgba(5,7,11,.8);color:var(--gold2);border:1px solid rgba(242,193,78,.6);border-radius:99px;padding:3px 9px;font-size:13px;font-weight:700}
.steps{margin:0;padding-left:22px}.steps li{margin-bottom:6px}
.proc{text-align:center}.proc img{width:min(260px,70%);border-radius:20px;display:block;margin:0 auto 14px}
.res-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center}
.shot{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:#05070b;display:block;border:1px solid rgba(242,193,78,.4)}
.score{font:800 italic clamp(64px,20vw,92px)/.9 'Barlow Condensed',sans-serif;color:var(--gold2)}
.say{display:flex;gap:12px;align-items:flex-start}
.say img{width:88px;height:88px;border-radius:14px;object-fit:cover;flex:none}
.bubble{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.bubble.good{border-color:rgba(47,179,106,.55)}.bubble.fix{border-color:rgba(242,193,78,.55)}
.mbar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3em;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.mbar .bar{margin:0}.mbar b{text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:center}
.vs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#05070b;display:block;margin-bottom:6px}
.warn{background:rgba(242,193,78,.1);border:1px solid rgba(242,193,78,.4);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
/* mokuso */
.breath{width:170px;height:170px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(59,123,232,.35),rgba(59,123,232,.05) 70%);border:2px solid rgba(59,123,232,.6);font:700 24px 'Barlow Condensed',sans-serif;transform:scale(.7);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
/* trening */
.lvlc{display:flex;gap:14px;align-items:center}
.lvlb{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 italic 30px 'Barlow Condensed',sans-serif;color:#1a1405;background:radial-gradient(circle at 35% 30%,#fff3b8,#f2c14e 60%,#a87a12);box-shadow:0 0 20px rgba(242,193,78,.35)}
.roll{min-height:110px;display:grid;place-items:center;font:800 italic clamp(26px,8vw,40px)/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--gold2);background:#05070b;border:1px solid var(--line);border-radius:14px;margin:8px 0 12px;padding:10px}
.roll small{display:block;font:600 18px Barlow,sans-serif;color:var(--ink);text-transform:none;margin-top:4px}
.rt{font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px}.g4{background:var(--gold);color:#1a1405}.g3{background:var(--blue);color:#fff}.g2{background:#3a404d;color:#fff}.g1{background:#5a2a22;color:#ffd2c8}
.play{position:fixed;inset:0;z-index:57;background:var(--bg);overflow-y:auto}.play[hidden]{display:none}
.pbody{padding:16px;text-align:center}
.pimg{width:min(240px,55vw);aspect-ratio:1;object-fit:cover;border-radius:20px;display:block;margin:4px auto 12px;border:1px solid rgba(242,193,78,.4)}
.pbig{font:800 italic clamp(84px,28vw,128px)/1 'Barlow Condensed',sans-serif;color:var(--gold2);font-variant-numeric:tabular-nums}
.pcues{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0 12px;text-align:left}.pcues p{margin:4px 0}
.pnext{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;text-align:left}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{margin:0}.days input{display:none}.days span{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);color:var(--ink);font-weight:600;cursor:pointer}.days input:checked+span{background:var(--gold);color:#1a1405;border-color:var(--gold)}
/* kalendarz, start */
.cal,.calh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calh{font-size:11px;color:var(--mute);text-align:center;margin-bottom:4px}
.cal i{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--mute);background:#161a22}
.c1{background:rgba(242,193,78,.3)!important;color:#fff!important}.c2{background:rgba(242,193,78,.62)!important;color:#1a1405!important}.c3{background:var(--gold)!important;color:#1a1405!important;box-shadow:0 0 10px rgba(242,193,78,.5)}
.cal i.td{outline:2px solid var(--gold2);outline-offset:1px}.cal i.fu{opacity:.3}
.calk{display:flex;gap:14px;justify-content:flex-end;font-size:12px;color:var(--mute);margin-top:8px}.calk i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.today{border-color:rgba(242,193,78,.55);box-shadow:0 0 30px rgba(242,193,78,.12)}
.tdy{display:flex;gap:12px;align-items:center;margin:8px 0 12px;text-decoration:none;color:var(--ink)}.tdy img{width:84px;height:84px;border-radius:14px;object-fit:cover;flex:none}.tdy b{font:700 24px/1.1 'Barlow Condensed',sans-serif}.tdy p{margin:4px 0 0}
.chrow{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;font-size:14px;text-decoration:none;color:var(--ink)}.chrow span{color:var(--gold2);white-space:nowrap;font-weight:600}
details.card>summary{color:var(--ink);font-size:17px;min-height:30px}
.m0{background:#2a2f3a;color:var(--mute)!important}
.belts{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}.bp{display:flex;gap:12px;align-items:center;text-align:left;min-height:48px;padding:6px 12px;line-height:1.2}.bp .swatch{width:48px;height:14px}.bp>span:last-child{display:flex;justify-content:space-between;align-items:baseline;flex:1;gap:8px}.bp .mute{white-space:nowrap}.bp br{display:none}.bp.on{border-color:var(--gold);background:rgba(242,193,78,.12);box-shadow:0 0 16px rgba(242,193,78,.3)}.bp .mute{font-size:12px}
.hs1{color:var(--gold);letter-spacing:1px;white-space:nowrap}.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;margin:0 0 10px;font-size:15px;line-height:1.3}
.help .say img{width:52px;height:52px}.help .bubble{padding:10px 12px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line);padding:8px 0}.tog:first-of-type{border-top:0}
.tog input{width:46px;height:26px;min-height:0;appearance:none;-webkit-appearance:none;background:#2a2f3a;border-radius:99px;position:relative;cursor:pointer;flex:none;border:0;padding:0;transition:background .2s}
.tog input::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tog input:checked{background:var(--gold)}.tog input:checked::after{left:23px}
@keyframes tabIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}main.tin{animation:tabIn .38s cubic-bezier(.2,.8,.3,1)}
.cerbelt{height:80px;margin:10px -10px 0}.cerbelt svg{width:100%;height:100%}
.feel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.faces button{display:grid;place-items:center;gap:2px;padding:6px 2px;min-height:64px;font-size:11px;line-height:1.1;color:var(--mute)}.faces button.on{border-color:var(--acc);background:rgba(242,193,78,.12);color:var(--ink)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl div{position:relative;margin-bottom:10px}.tl div::before{content:'';position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--acc)}.tl b{display:block}.tl span{color:var(--mute);font-size:14px}
details.prep>summary{display:flex;align-items:center;gap:10px}
.cnt{font:600 15px Barlow,sans-serif}
.snd{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:2;width:38px;height:38px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(5,7,11,.45);border:1px solid rgba(255,255,255,.18);color:#fff;opacity:.6;backdrop-filter:blur(6px)}
.snd:hover{opacity:1}.snd svg{width:20px;height:20px}.snd.off{opacity:.85;color:var(--acc)}
.pbar .snd{position:static;opacity:.7;margin-right:8px;flex:none}
/* karty */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;display:block;width:100%;position:relative}
.kc img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.kc .t{padding:10px 12px 12px}.kc b{display:block;font:700 19px/1.1 'Barlow Condensed',sans-serif}.kc .mute{font-size:13px;line-height:1.3;margin-top:2px}
.kc.on{border-color:rgba(242,193,78,.7);box-shadow:0 0 22px rgba(242,193,78,.18)}
.kc.on::after{content:'▶';position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:var(--gold);display:grid;place-items:center;font-size:13px}
.kc.on.noplay::after{content:'★'}
.kc.lock img{filter:grayscale(1) brightness(.22) blur(3px)}
.kc .lk{position:absolute;left:0;right:0;top:0;aspect-ratio:1;display:grid;place-items:center}
.kc .lk svg{width:40px;height:40px;color:#6d7482}
.nextc{display:flex;gap:14px;align-items:center}
.nextc img{width:76px;height:76px;border-radius:12px;object-fit:cover;filter:grayscale(1) brightness(.3) blur(2px);flex:none}
.nextc div{flex:1}
/* karta postaci */
.prof{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.prof[hidden]{display:none}
.pbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(7,9,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pcard{border-radius:22px;overflow:hidden;border:2px solid rgba(242,193,78,.6);box-shadow:0 0 40px rgba(242,193,78,.18);background:linear-gradient(180deg,#151924,#0b0e14);margin-bottom:14px}
.pcard>img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pinfo{padding:14px 16px 16px;margin-top:-70px;position:relative;background:linear-gradient(transparent,#0e1118 60px)}
.lvl{display:inline-flex;align-items:center;gap:8px;background:rgba(5,7,11,.75);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 6px;font-size:14px;font-weight:600}
.lvl .swatch{width:34px;height:12px}
.mwall{display:flex;flex-wrap:wrap;gap:12px}
.mw{width:calc(33.33% - 8px);text-align:center;font-size:12px;line-height:1.25;color:var(--mute)}
.mw .medal{width:56px;height:56px;margin:0 auto 6px;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.mw b{display:block;color:var(--ink);font-size:13px}
.mcols{display:flex;gap:12px;margin-bottom:10px}
.mcols button{width:56px;height:56px;border-radius:50%;padding:0;border:3px solid transparent;font:700 20px 'Barlow Condensed',sans-serif;color:#1a1405}
.mcols button.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumbs img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;border:1px solid rgba(242,193,78,.5)}
/* nawigacja */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,16,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs a{display:grid;place-items:center;gap:1px;min-height:58px;color:var(--mute);text-decoration:none;font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}nav.tabs a.on{color:var(--acc)}
/* splash, intro, celebracje */
.splash,.intro,.ov{position:fixed;inset:0;z-index:40;background:#05070b}
.splash img{width:100%;height:100%;object-fit:cover;display:block}
@media(min-aspect-ratio:3/4){.splash img{object-fit:contain}}
.sp-b{position:absolute;left:0;right:0;bottom:0;padding:60px 22px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,7,11,.92) 50%);text-align:center}
.sp-b .btn-p{max-width:420px;animation:pulse 2s infinite}
#dedi{position:absolute;left:20px;right:20px;bottom:calc(7vh + env(safe-area-inset-bottom));text-align:center;font:600 italic 20px/1.3 'Barlow Condensed',sans-serif;color:#f6e7c1;margin:0;opacity:0;animation:rise 1.2s 3.2s forwards}#dedi:empty{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,193,78,.55)}70%{box-shadow:0 0 0 12px rgba(242,193,78,0)}}
.splash.out,.intro.out{opacity:0;transition:opacity .5s;pointer-events:none}
.intro{display:grid;place-items:center}.intro[hidden],.ov[hidden],.splash[hidden]{display:none}
.intro video{width:100vw;height:100vh;height:100dvh;object-fit:cover;object-position:center 30%}@media(min-aspect-ratio:3/4){.intro video{object-fit:contain}}
.intro h2{position:absolute;left:0;right:0;bottom:calc(14vh + env(safe-area-inset-bottom));text-align:center;font:800 italic clamp(44px,13vw,72px)/1 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--gold2);text-shadow:0 0 30px rgba(242,193,78,.6);opacity:0;animation:rise 1.2s 2.4s forwards}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.skip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top));background:rgba(0,0,0,.5);border-color:rgba(255,255,255,.2)}
.ov{background:rgba(3,4,7,.94);display:grid;place-items:center;padding:20px;z-index:60}
.ov canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ov-in{position:relative;width:min(420px,100%);text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.ovm{width:min(100%,52vh);margin:0 auto 14px}
.ovm video,.ovm img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;display:block;box-shadow:0 0 70px rgba(242,193,78,.35);border:1px solid rgba(242,193,78,.45)}
#ovt{font:800 italic clamp(36px,10vw,48px)/1 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--gold2);margin-bottom:6px}
#ovs{color:#c9ced6}#ovs:empty{display:none}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
/* efekty przycisków */
button,a.card,.dr,.kc{position:relative;overflow:hidden;transition:transform .12s ease,box-shadow .25s ease,border-color .25s ease,background-color .25s ease,filter .2s}
button:not(:disabled):hover,a.card:hover,.dr:hover,.kc.on:hover{border-color:rgba(242,193,78,.65);box-shadow:0 0 0 1px rgba(242,193,78,.25),0 0 22px rgba(242,193,78,.2)}
button:not(:disabled):active,a.card:active,.dr:active,.kc.on:active{transform:scale(.96);box-shadow:0 0 0 1px rgba(242,193,78,.45),0 0 28px rgba(242,193,78,.35)}
.btn-p{box-shadow:0 6px 22px rgba(242,193,78,.28),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(120,80,0,.25);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn-p:not(:disabled):hover{filter:brightness(1.06);box-shadow:0 8px 30px rgba(242,193,78,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-b{box-shadow:0 6px 20px rgba(59,123,232,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-b:not(:disabled):hover{box-shadow:0 8px 28px rgba(59,123,232,.5),inset 0 1px 0 rgba(255,255,255,.35);border-color:#7aa6f5}
.btn-p::after,.btn-b::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);pointer-events:none;opacity:0}
.btn-p.bigbtn::after{opacity:1;animation:sheen 3.4s ease-in-out infinite}
.btn-p:hover::after,.btn-b:hover::after,.btn-p:active::after,.btn-b:active::after{opacity:1;animation:sheen .8s ease-out}
@keyframes sheen{0%,55%{left:-70%}100%{left:135%}}
.chip.on{box-shadow:0 0 16px rgba(242,193,78,.4)}
nav.tabs a{transition:color .2s}nav.tabs a.on svg{filter:drop-shadow(0 0 6px currentColor)}nav.tabs a{position:relative;overflow:hidden}
nav.tabs a.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.rip{position:absolute;border-radius:50%;transform:scale(0);background:radial-gradient(circle,rgba(255,236,170,.55),rgba(242,193,78,.25) 60%,transparent 70%);animation:rip .6s ease-out forwards;pointer-events:none;z-index:0}
.btn-p .rip{background:radial-gradient(circle,rgba(255,255,255,.38),rgba(255,255,255,.12) 60%,transparent 70%)}
@keyframes rip{to{transform:scale(2.8);opacity:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.intro h2{opacity:1}.rip{display:none}}
</style>
</head>

<script type="application/json" id="tdata">{"meta":{"for":"Dziewczynka 11 lat, karate Kyokushin (niebieski pas), kata + kumite","version":1,"created":"2026-11-21","disclaimer":"Materiał edukacyjny, nie zastępuje trenera ani lekarza. Przy bólu, urazie lub chorobie – przerwa i konsultacja."},"principles":[{"text":"Najpierw technika, potem więcej powtórzeń. Ładny ruch wygrywa z szybkim.","source":"NSCA 2009 (Faigenbaum i in.); Lloyd i in. 2014 (UKSCA, BJSM)"},{"text":"Ćwiczymy masą własnego ciała. Żadnych maksymalnych ciężarów ani prób 'ile max'.","source":"NSCA 2009; Lloyd i in. 2014"},{"text":"Siła 2–3 razy w tygodniu, nie dzień po dniu. Na start 1–2 serie po 8–15 powtórzeń, przerwa ok. 1 min.","source":"NSCA 2009"},{"text":"Zawsze 5–10 min rozgrzewki dynamicznej. Rozciąganie statyczne zostaw na koniec.","source":"NSCA 2009"},{"text":"Skala zmęczenia 1–10: zwykle trenuj na 5–7 ('trudno, ale dam radę rozmawiać'). Ostatnie powtórzenie ma być ładne.","source":"Lloyd i in. 2016 (NSCA LTAD) – monitorowanie obciążeń; skala RPE (wartości 5–7: konserwatywne założenie aplikacji)"},{"text":"Ból = STOP. Nie ćwiczymy przez ból ani przed pełnym wyleczeniem urazu czy choroby.","source":"IOC 2015 (Bergeron i in.)"},{"text":"Okres skoku wzrostu: kości rosną szybciej niż mięśnie, koordynacja może chwilowo się pogorszyć. Wtedy mniejsza objętość skoków i więcej techniki.","source":"Lloyd i in. 2016 (NSCA LTAD)"},{"text":"U dziewcząt warto wzmacniać tył uda i pośladki oraz uczyć miękkiego lądowania – chroni kolana.","source":"Lloyd i in. 2016 (NSCA LTAD); Ramirez-Campillo i in. 2023"},{"text":"Skoki: niskie, ciche, na miękkiej nawierzchni (mata, trawa, parkiet). Najpierw nauka lądowania, potem większa wysokość.","source":"Ramirez-Campillo i in. 2023 (Sports Med Open)"},{"text":"Minimum 1 pełny dzień odpoczynku w tygodniu, a przed zawodami ok. 48 h bez ciężkiego treningu.","source":"Lloyd i in. 2016 (NSCA LTAD); IOC 2015"},{"text":"Sen: ponad 7 godzin, najlepiej 9–11. Sen to też trening!","source":"Lloyd i in. 2016 (≥7 h); zakres 9–11 h dla 6–12 lat – AASM (zalecenie ogólne)"},{"text":"Pij wodę przed, w trakcie i po treningu, jedz regularnie. Brak energii = gorsze wyniki i większe ryzyko urazów.","source":"IOC 2015 (RED-S, odżywianie młodych sportowców)"},{"text":"Zabawa przede wszystkim. Brak radości to główny powód rezygnacji ze sportu.","source":"Lloyd i in. 2016; IOC 2015"},{"text":"Rób różne rzeczy, nie tylko karate: siła, skoki, równowaga, bieganie, gry. To buduje lepszą sportsmenkę.","source":"IOC 2015; Lloyd i in. 2016; Balyi (LTAD) – etap Learn to Train / Train to Train"},{"text":"Każdego dnia średnio 60 min ruchu, a 3 dni w tygodniu coś intensywnego i wzmacniającego mięśnie i kości.","source":"WHO 2020"},{"text":"Dorosły czuwa nad treningiem, szczególnie przy nowych ćwiczeniach.","source":"NSCA 2009; Lloyd i in. 2014"},{"text":"Porównuj się z sobą sprzed miesiąca, nie z innymi. Dzieci dojrzewają w różnym tempie.","source":"IOC 2015; Lloyd i in. 2016"},{"text":"Gibkość: rozciągaj się tylko do lekkiego ciągnięcia, nigdy na zimno i bez dociskania przez kogoś.","source":"NSCA 2009 (stretching statyczny w części końcowej); zasada bezpieczeństwa aplikacji"}],"exercises":[{"id":"trucht","name":"Trucht w miejscu","cat":"rozgrzewka","level":1,"mode":"time","dose":{"sets":1,"sec":60},"rest_sec":0,"cues":["Lekko na palcach","Ręce pracują jak przy biegu"],"easier":null,"harder":"skip_a","safety":null,"equipment":"brak"},{"id":"krazenia_ramion","name":"Krążenia ramion","cat":"rozgrzewka","level":1,"mode":"reps","dose":{"sets":1,"reps":10},"rest_sec":0,"cues":["Duże koła w przód, potem w tył","Plecy proste"],"easier":null,"harder":null,"safety":null,"equipment":"brak"},{"id":"wymachy_przod","name":"Wymachy nóg w przód","cat":"rozgrzewka","level":1,"mode":"reps","dose":{"sets":1,"reps":10},"rest_sec":0,"cues":["Trzymaj się ściany","Noga luźna jak wahadło","Coraz wyżej, bez szarpania"],"easier":null,"harder":"wymachy_bok","safety":"Wymachy kontrolowane – nie rzucaj nogą na siłę.","equipment":"brak"},{"id":"wymachy_bok","name":"Wymachy nóg w bok","cat":"rozgrzewka","level":1,"mode":"reps","dose":{"sets":1,"reps":10},"rest_sec":0,"cues":["Biodra przodem do ściany","Noga leci w bok i wraca spokojnie"],"easier":"wymachy_przod","harder":null,"safety":null,"equipment":"brak"},{"id":"gasienica","name":"Gąsienica","cat":"rozgrzewka","level":1,"mode":"reps","dose":{"sets":1,"reps":5},"rest_sec":0,"cues":["Dłonie idą do przodu aż do deski","Potem stopy drobią do rąk"],"easier":null,"harder":"niedzwiedz","safety":null,"equipment":"brak"},{"id":"otwieranie_bramy","name":"Otwieranie bramy (krążenie biodra)","cat":"rozgrzewka","level":1,"mode":"reps","dose":{"sets":1,"reps":8},"rest_sec":0,"cues":["Kolano w górę, potem w bok – jak otwierasz bramę","Stój prosto, możesz trzymać się ściany"],"easier":null,"harder":"kolano_balans","safety":null,"equipment":"brak"},{"id":"pompki_sciana","name":"Pompki przy ścianie","cat":"sila","level":1,"mode":"reps","dose":{"sets":2,"reps":10},"rest_sec":60,"cues":["Ciało proste jak deska","Klatka blisko ściany, łokcie lekko przy bokach"],"easier":null,"harder":"pompki_podwyzszenie","safety":null,"equipment":"brak"},{"id":"pompki_podwyzszenie","name":"Pompki na podwyższeniu (kanapa/ławka)","cat":"sila","level":1,"mode":"reps","dose":{"sets":2,"reps":8},"rest_sec":60,"cues":["Dłonie na stabilnym meblu","Brzuch napięty, pupa nie opada"],"easier":"pompki_sciana","harder":"pompki_kolana","safety":"Mebel musi stać stabilnie i się nie przesuwać.","equipment":"brak"},{"id":"pompki_kolana","name":"Pompki na kolanach","cat":"sila","level":2,"mode":"reps","dose":{"sets":2,"reps":8},"rest_sec":60,"cues":["Od kolan do głowy prosta linia","Schodź powoli, wypychaj mocno"],"easier":"pompki_podwyzszenie","harder":"pompki","safety":null,"equipment":"brak"},{"id":"pompki","name":"Pompki","cat":"sila","level":3,"mode":"reps","dose":{"sets":2,"reps":6},"rest_sec":75,"cues":["Ciało twarde jak deska","Klatka nisko, łokcie pod kątem jak strzałka"],"easier":"pompki_kolana","harder":null,"safety":"Jeśli pupa opada albo boli nadgarstek – wróć do łatwiejszej wersji.","equipment":"brak"},{"id":"przysiad","name":"Przysiad","cat":"sila","level":1,"mode":"reps","dose":{"sets":2,"reps":12},"rest_sec":60,"cues":["Pupa w tył jak na krzesło","Kolana idą nad palcami","Pięty na ziemi"],"easier":null,"harder":"przysiad_pauza","safety":null,"equipment":"brak"},{"id":"przysiad_pauza","name":"Przysiad z pauzą","cat":"sila","level":2,"mode":"reps","dose":{"sets":2,"reps":8},"rest_sec":60,"cues":["Zatrzymaj się na dole na 2 sekundy","Wstawaj szybko i dumnie"],"easier":"przysiad","harder":null,"safety":null,"equipment":"brak"},{"id":"wykrok_tyl","name":"Wykrok w tył","cat":"sila","level":1,"mode":"reps","dose":{"sets":2,"reps":8},"rest_sec":60,"cues":["Krok w tył, kolano prawie do podłogi","Tułów prosto jak król"],"easier":null,"harder":"wykrok_przod","safety":"Dawka = na każdą nogę.","equipment":"brak"},{"id":"wykrok_przod","name":"Wykrok w przód","cat":"sila","level":2,"mode":"reps","dose":{"sets":2,"reps":8},"rest_sec":60,"cues":["Duży krok, kolano nad stopą","Odpychaj się z pięty"],"easier":"wykrok_tyl","harder":null,"safety":"Dawka = na każdą nogę.","equipment":"brak"},{"id":"mostek_biodrowy","name":"Mostek biodrowy","cat":"sila","level":1,"mode":"reps","dose":{"sets":2,"reps":12},"rest_sec":45,"cues":["Leżysz, stopy blisko pupy","Pupa w górę, ściśnij pośladki","Zatrzymaj 2 s na górze"],"easier":null,"harder":"mostek_jednonoz","safety":null,"equipment":"brak"},{"id":"mostek_jednonoz","name":"Mostek biodrowy na jednej nodze","cat":"sila","level":2,"mode":"reps","dose":{"sets":2,"reps":8},"rest_sec":45,"cues":["Jedna noga w górze","Biodra równo, nie przechylaj się"],"easier":"mostek_biodrowy","harder":null,"safety":"Dawka = na każdą nogę.","equipment":"brak"},{"id":"superman","name":"Superman","cat":"sila","level":1,"mode":"time","dose":{"sets":2,"sec":15},"rest_sec":45,"cues":["Leżysz na brzuchu"," unds":1,"items":[{"ex":"kata_wolno"},{"ex":"kolano_balans","dose":{"sets":1,"sec":10}},{"ex":"seiken_seria","dose":{"sets":2,"sec":10}},{"ex":"wejscia_wyjscia","dose":{"sets":2,"sec":15}},{"ex":"start_reakcja","dose":{"sets":1,"reps":3}}]},{"name":"Wyciszenie","format":"seria","rounds":1,"items":[{"ex":"motyl","dose":{"sets":1,"sec":30}},{"ex":"biodra_9090","dose":{"sets":1,"reps":4}}]}]},{"id":"runda_kumite","name":"Runda kumite","goal":"Kondycja walki: rundy, praca nóg, kombinacje","minutes":25,"level":3,"blocks":[{"name":"Rozgrzewka","format":"seria","rounds":1,"items":[{"ex":"trucht"},{"ex":"krazenia_ramion"},{"ex":"wymachy_przod"},{"ex":"otwieranie_bramy"},{"ex":"skakanka","dose":{"sets":2,"sec":30}}]},{"name":"Część główna","format":"interwał","rounds":3,"items":[{"ex":"shadow_kumite","dose":{"sets":1,"sec":60}},{"ex":"gyaku_seria","dose":{"sets":1,"sec":20}},{"ex":"mawashi_seria","dose":{"sets":1,"reps":6}},{"ex":"wejscia_wyjscia","dose":{"sets":1,"sec":20}},{"ex":"deska","dose":{"sets":1,"sec":30}}]},{"name":"Wyciszenie","format":"seria","rounds":1,"items":[{"ex":"trucht","dose":{"sets":1,"sec":60}},{"ex":"przywodziciele"},{"ex":"zginacze_bioder"}]}]},{"id":"czapla","name":"Czapla i tornado","goal":"Równowaga i kontrola przy kopnięciach","minutes":15,"level":2,"blocks":[{"name":"Rozgrzewka","format":"seria","rounds":1,"items":[{"ex":"trucht"},{"ex":"krazenia_ramion"},{"ex":"wymachy_przod"},{"ex":"otwieranie_bramy"}]},{"name":"Część główna","format":"obwód","rounds":2,"items":[{"ex":"jedna_noga","dose":{"sets":1,"sec":30}},{"ex":"kolano_balans","dose":{"sets":1,"sec":10}},{"ex":"kopniecie_wolne","dose":{"sets":1,"reps":4}},{"ex":"kiba_dachi","dose":{"sets":1,"sec":20}},{"ex":"jaskolka","dose":{"sets":1,"reps":5}},{"ex":"wspiecia_palce","dose":{"sets":1,"reps":12}}]},{"name":"Wyciszenie","format":"seria","rounds":1,"items":[{"ex":"lydki"},{"ex":"biodra_9090"}]}]},{"id":"olimpiada","name":"Rodzinna olimpiada","goal":"Zabawa z rodziną – kto zdobędzie więcej punktów","minutes":20,"level":1,"blocks":[{"name":"Rozgrzewka","format":"seria","rounds":1,"items":[{"ex":"pajacyki","dose":{"sets":1,"sec":30}},{"ex":"krazenia_ramion"},{"ex":"otwieranie_bramy"}]},{"name":"Część główna","format":"obwód","rounds":2,"items":[{"ex":"reakcja_kolory","dose":{"sets":1,"sec":30}},{"ex":"niedzwiedz","dose":{"sets":1,"sec":20}},{"ex":"skoki_obunoz","dose":{"sets":1,"reps":6}},{"ex":"jedna_noga","dose":{"sets":1,"sec":30}},{"ex":"bieg_wahadlowy","dose":{"sets":1,"reps":1}},{"ex":"deska_kolana","dose":{"sets":1,"sec":20}}]},{"name":"Wyciszenie","format":"seria","rounds":1,"items":[{"ex":"motyl"},{"ex":"przywodziciele"}]}]},{"id":"poranna_iskra","name":"Poranna iskra","goal":"10 minut ruchu i mobilności na dobry start dnia","minutes":10,"level":1,"blocks":[{"name":"Rozgrzewka","format":"seria","rounds":1,"items":[{"ex":"trucht","dose":{"sets":1,"sec":45}},{"ex":"krazenia_ramion"}]},{"name":"Część główna","format":"obwód","rounds":1,"items":[{"ex":"gasienica"},{"ex":"przysiad","dose":{"sets":1,"reps":10}},{"ex":"biodra_9090","dose":{"sets":1,"reps":6}},{"ex":"wymachy_przod"},{"ex":"wymachy_bok"},{"ex":"jedna_noga","dose":{"sets":1,"sec":20}}]},{"name":"Wyciszenie","format":"seria","rounds":1,"items":[{"ex":"zginacze_bioder","dose":{"sets":1,"sec":20}}]}]},{"id":"skoczek","name":"Sprężynka","goal":"Niskie skoki i lądowania – siła nóg i bezpieczne kolana","minutes":15,"level":2,"blocks":[{"name":"Rozgrzewka","format":"seria","rounds":1,"items":[{"ex":"trucht"},{"ex":"krazenia_ramion"},{"ex":"wymachy_przod"},{"ex":"otwieranie_bramy"},{"ex":"skakanka","dose":{"sets":1,"sec":30}}]},{"name":"Część główna","format":"seria","rounds":1,"items":[{"ex":"skoki_obunoz"},{"ex":"skoki_boczne"},{"ex":"skok_w_dal"},{"ex":"wspiecia_palce"},{"ex":"mostek_biodrowy"}]},{"name":"Wyciszenie","format":"seria","rounds":1,"items":[{"ex":"lydki"},{"ex":"tyl_uda"}]}]}],"week_template":{"title":"Tydzień wojowniczki","rules":["Nie więcej niż 1 cięższy trening w domu dzień po klubie.","Najcięższe sesje domowe w dni bez klubu.","Min. 1 dzień pełnego odpoczynku (spacer, zabawa – OK).","Przed zawodami 2 dni tylko lekko ('Spokojna głowa przed turniejem').","Codziennie można zrobić 10 min ('Brzuszkowy ekspres' lub 'Poranna iskra') – to lekka dawka.","Gdy bardzo zmęczona, coś boli albo źle śpi – dzień wolny zamiast treningu."],"variant_2_club":{"pon":"Siłaczka (średnio-ciężko) lub Pierwsze kroki siłaczki","wt":"KLUB + 10 min Gumowe nogi wieczorem (lekko)","sr":"Błyskawica lub Sprężynka (średnio)","czw":"KLUB","pt":"Brzuszkowy ekspres + Czapla i tornado (lekko)","sob":"Serce wojowniczki lub Rodzinna olimpiada (zabawa)","nd":"ODPOCZYNEK"},"variant_3_club":{"pon":"KLUB","wt":"Siłaczka (średnio-ciężko)","sr":"KLUB","czw":"Gumowe nogi + Brzuszkowy ekspres (lekko)","pt":"KLUB","sob":"Błyskawica lub Rodzinna olimpiada","nd":"ODPOCZYNEK"},"note":"Siła 2–3×/tydz. (licząc klub), nie dzień po dniu; skoki 1–2×/tydz. z ≥48 h przerwy. Dni klubowe dopasuj do własnego grafiku."},"tests":[{"id":"skok_dal","name":"Skok w dal z miejsca","how":["Rozgrzej się 5 min.","Stań palcami przy linii, stopy na szerokość bioder.","Wymach rąk i skok obunóż jak najdalej.","Zmierz od linii do pięty bliżej linii.","2 próby, zapisz lepszą."],"unit":"cm","better":"higher","ref_11_girls":{"low":123,"avg":141,"good":159},"ref_note":"Eurofit, dziewczęta 11 lat: P20/P50/P80 = 122,6/140,6/158,7 cm (Tomkinson i in. 2018, BJSM). Podobnie FitBack 2023: 120/140/160 cm (Ortega i in., BJSM)."},{"id":"brzuszki30","name":"Brzuszki w 30 sekund","how":["Leżysz, kolana zgięte pod kątem 90°, ktoś trzyma stopy.","Ręce skrzyżowane na klatce lub przy skroniach.","Siad do dotknięcia łokciami ud, powrót łopatkami na podłogę.","Licz pełne powtórzenia w 30 s."],"unit":"powt.","better":"higher","ref_11_girls":{"low":15,"avg":19,"good":22},"ref_note":"Eurofit sit-ups 30 s, dziewczęta 11 lat: P20/P50/P80 = 15/19/22 (Tomkinson i in. 2018)."},{"id":"flamingo","name":"Flamingo – równowaga","how":["Stań na jednej nodze na niskiej listewce/linii (wersja domowa: na podłodze).","Drugą stopę trzymaj ręką za pupą.","Mierz 60 s – zatrzymuj stoper przy każdym upadku/puszczeniu stopy i licz próby.","Wynik = liczba utrat równowagi w 60 s."],"unit":"upadki/60 s","better":"lower","ref_11_girls":{"low":17,"avg":11,"good":7},"ref_note":"Eurofit flamingo (na belce 3 cm), dziewczęta 11 lat: P20/P50/P80 = 17/11/7 (Tomkinson i in. 2018). Na płaskiej podłodze wynik będzie lepszy – porównuj głównie z własnymi wynikami."},{"id":"sklon","name":"Skłon w siadzie (sit-and-reach)","how":["Rozgrzej się. Siad prosty, stopy oparte o pudełko/stopień.","Połóż linijkę na pudełku: poziom stóp = 15 cm.","Powoli przesuń dłonie jak najdalej, kolana proste, wytrzymaj 2 s.","Zapisz wynik (np. 5 cm za palcami = 20 cm). Lepsza z 2 prób."],"unit":"cm","better":"higher","ref_11_girls":{"low":14.5,"avg":20.1,"good":25.6},"ref_note":"Eurofit sit-and-reach, dziewczęta 11 lat: P20/P50/P80 = 14,5/20,1/25,6 cm (Tomkinson i in. 2018). Eurofit przyjmuje 15 cm na wysokości stóp; domowy pomiar jest przybliżony."},{"id":"wahadlowy10x5","name":"Bieg wahadłowy 10×5 m","how":["Dwie linie co 5 m, bezpieczna nawierzchnia.","Na 'start' biegnij do drugiej linii i z powrotem – to 2 odcinki.","Razem 10 odcinków (5 razy tam i z powrotem), za każdym razem przekrocz linię obiema stopami.","Ktoś mierzy czas stoperem."],"unit":"s","better":"lower","ref_11_girls":{"low":24.6,"avg":22.6,"good":20.9},"ref_note":"Eurofit 10×5 m, dziewczęta 11 lat: P20/P50/P80 = 24,64/22,58/20,90 s (Tomkinson i in. 2018). Nie znaleziono równie wiarygodnych norm Eurofit dla wersji 4×10 m – dlatego test 10×5 m."},{"id":"pompki_test","name":"Pompki do zmęczenia (tempo 1 na 3 s)","how":["Pozycja pompki, ciało proste.","Schodź do kąta 90° w łokciach, w tempie: 1 pompka na 3 sekundy.","Licz poprawne pompki, kończ przy 2. błędzie techniki lub utracie tempa."],"unit":"powt.","better":"higher","ref_11_girls":null,"target":{"min":9,"good":15},"ref_note":"Brak percentyli. FitnessGram (Cooper Institute, v10, 2013): strefa zdrowia dla dziewcząt 11 lat od 9 pompek 90°. Wartość 'good'=15 to ostrożny cel aplikacji, nie norma."},{"id":"deska_test","name":"Deska na czas","how":["Deska na przedramionach, łokcie pod ramionami.","Ciało prosto od głowy do pięt.","Stop, gdy biodra opadną lub podniosą się drugi raz po upomnieniu.","Zapisz czas."],"unit":"s","better":"higher","ref_11_girls":null,"target":{"min":60,"good":90},"ref_note":"Brak percentyli dla 11-latek. CDC NHANES NYFS 2012: średnia dziewcząt 6–11 lat 61 s, 12–15 lat 77 s. Cel 60/90 s to ostrożne założenie aplikacji. Nie przekraczaj 2 min – liczy się technika."},{"id":"beep","name":"Beep test 20 m (opcjonalnie, sala/podwórko)","how":["Potrzebne 20 m i nagranie/aplikacja z sygnałami beep testu.","Biegnij między liniami w rytmie sygnałów, tempo rośnie co etap.","Koniec, gdy 2 razy z rzędu nie zdążysz do linii.","Zapisz ukończony etap."],"unit":"etap","better":"higher","ref_11_girls":{"low":2.6,"avg":4.1,"good":5.5},"ref_note":"Eurofit 20 m shuttle run, dziewczęta 11 lat: P20/P50/P80 = 2,64/4,07/5,53 (min/etapy; Tomkinson i in. 2018). FitBack 2023: 2,2/3,6/5,3 etapu (Ortega i in.). Test bardzo męczący – nie przed zawodami."}],"sources":[{"title":"Faigenbaum AD i in. Youth resistance training: updated position statement paper from the NSCA. J Strength Cond Res 2009;23(5 Suppl):S60–79","url":"https://dxpprod.nsca.com/globalassets/about/position-statements/position_stand_youth_resistance_training---2009.pdf","note":"Bezpieczeństwo, 1–3 serie × 6–15 powt., 2–3×/tydz. nie dzień po dniu, rozgrzewka 5–10 min, nadzór dorosłego."},{"title":"Lloyd RS i in. Position statement on youth resistance training: the 2014 International Consensus. Br J Sports Med 2014;48:498–505 (na bazie stanowiska UKSCA)","url":"https://bjsm.bmj.com/content/48/7/498.long","note":"Międzynarodowy konsensus; trening oporowy bezpieczny i korzystny przy właściwym nadzorze i progresji."},{"title":"Lloyd RS i in. NSCA position statement on long-term athletic development. J Strength Cond Res 2016;30(6):1491–1509","url":"https://dxpprod.nsca.com/globalassets/education/nsca_position_statement_on_ltad.pdf","note":"10 filarów LTAD; skok wzrostu, unikanie wczesnej specjalizacji, zabawa, regeneracja (≥48 h przed zawodami, >7 h snu)."},{"title":"Lloyd RS, Oliver JL. The Youth Physical Development Model. Strength Cond J 2012;34(3):61–72","url":"https://pure.cardiffmet.ac.uk/en/publications/the-youth-physical-development-model-a-new-approach-to-long-term-/","note":"Model YPD: siła, umiejętności ruchowe i szybkość/zwinność rozwijane przez całe dzieciństwo."},{"title":"Bergeron MF i in. IOC consensus statement on youth athletic development. Br J Sports Med 2015;49:843–851","url":"https://www.sportaus.gov.au/__data/assets/pdf_file/0004/689647/IOC_consensus_statement_on_youth_athletic_development.pdf","note":"Indywidualizacja wg dojrzewania, zarządzanie obciążeniem, nie trenować przez ból, zabawa, odżywianie (RED-S)."},{"title":"WHO guidelines on physical activity and sedentary behaviour (2020) – dzieci i młodzież 5–17 lat","url":"https://www.who.int/europe/news-room/fact-sheets/item/physical-activity","note":"Średnio ≥60 min/dzień MVPA; aktywność intensywna oraz wzmacniająca mięśnie i kości ≥3 dni/tydz."},{"title":"CDC – Physical Activity Guidelines for School-Aged Children and Adolescents","url":"https://www.cdc.gov/physical-activity-education/guidelines/","note":"Potwierdza: 60 min dziennie; intensywny wysiłek, siła mięśni i kości – po ≥3 dni/tydz."},{"title":"Balyi I, Way R, Higgs C. Long-Term Athlete Development (Human Kinetics) – 7 etapów","url":"https://us.humankinetics.com/blogs/excerpt/long-term-athlete-development-follows-seven-stages","note":"Dziewczęta: Learn to Train 8–11, Train to Train 11–15 (budowa bazy tlenowej, szybkość pod koniec etapu)."},{"title":"Tomkinson GR i in. European normative values for physical fitness in children and adolescents aged 9–17 years (Eurofit, 2 779 165 wyników). Br J Sports Med 2018;52:1445–1456","url":"https://core.ac.uk/download/235074871.pdf","note":"Normy (percentyle) dla 11-letnich dziewcząt: skok w dal, sit-ups 30 s, flamingo, sit-and-reach, 10×5 m, beep test."},{"title":"Ortega FB i in. European fitness landscape for children and adolescents (FitBack). Br J Sports Med 2023;57:299–310","url":"https://repository.essex.ac.uk/35891/1/European%20fitness%20landscape%20for%20children%20and%20adolescents%20updated%20reference%20values%2C%20fitness%20maps%20and%20country%20rankings%20based%20on.pdf","note":"Aktualne normy europejskie: skok w dal, siła chwytu, beep test (dziewczęta 11 lat)."},{"title":"FitnessGram Healthy Fitness Zone Standards (Cooper Institute, v10, 2013)","url":"https://www.isbe.net/Documents/HFZ_Standards.pdf","note":"Progi zdrowia: pompki 90° (dziewczęta 11 l.: 9), curl-up (>15)."},{"title":"Fulton JE i in. Measures of Muscular Strength in U.S. Children and Adolescents, 2012. NCHS Data Brief 139 (NHANES NYFS)","url":"https://www.cdc.gov/nchs/products/databriefs/db139.htm","note":"Deska: średnio 61 s (dziewczęta 6–11 lat), 77 s (12–15 lat)."},{"title":"Ramirez-Campillo R i in. Plyometric-jump training effects ... according to maturity: systematic review with meta-analysis. Sports Med Open 2023;9:23","url":"https://link.springer.com/10.1186/s40798-023-00568-6","note":"Skoki bezpieczne i skuteczne u młodzieży; start ok. 90 skoków/tydz., 1–2×/tydz., ≥48 h przerwy, miękka nawierzchnia."},{"title":"de Borja C i in. Primary Care Considerations for Youth Martial Arts Athletes. Curr Rev Musculoskelet Med 2025;18:73–78","url":"https://link.springer.com/article/10.1007/s12178-024-09942-7","note":"Karate: najczęściej urazy stopy/kostki; zalecany nadzorowany trening siły, core i równowagi."}]}</script>

function chartSvg(list){const n=list.length,W=340,H=230,L=54,Rr=24,top=30,bot=44,ih=H-top-bot,x=i=>n===1?(L+W-Rr)/2:L+i*(W-L-Rr)/(n-1),y=s=>top+(1-s/100)*ih;
 let g=`<rect x="${L-8}" y="${y(100)}" width="${W-L-Rr+16}" height="${y(80)-y(100)}" fill="rgba(242,193,78,.12)" rx="6"/><rect x="${L-8}" y="${y(80)}" width="${W-L-Rr+16}" height="${y(60)-y(80)}" fill="rgba(59,123,232,.10)" rx="6"/>`;
 g+=`<text x="${L-12}" y="${y(90)+4}" text-anchor="end" font-size="10" fill="#f2c14e">super</text><text x="${L-12}" y="${y(70)+4}" text-anchor="end" font-size="10" fill="#8fb4f5">dobrze</text><text x="${L-12}" y="${y(30)+4}" text-anchor="end" font-size="10" fill="#9aa2af">trenuj</text>`;
 if(n>1)g+=`<polyline points="${list.map((a,i)=>x(i)+','+y(a.sc)).join(' ')}" fill="none" stroke="#f2c14e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
 list.forEach((a,i)=>{const cx=x(i),cy=y(a.sc),r=17,col=a.sc>=80?'#f2c14e':a.sc>=60?'#3b7be8':'#9aa2af';
  g+=`<clipPath id="c${a.id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${r+2}" fill="#05070b" stroke="${col}" stroke-width="3"/><image data-img="${a.id}" x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" preserveAspectRatio="xMidYMid slice" clip-path="url(#c${a.id})"/>
  <text x="${cx}" y="${cy-r-7}" text-anchor="middle" font-size="14" font-weight="700" fill="#ffe08a">${a.sc}</text><text x="${cx}" y="${H-14}" text-anchor="middle" font-size="11" fill="#9aa2af">${plShort(a.d)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres wyników">${g}</svg>`}

function todayPlan(){if(!TD||!TD.plans.length)return null;const P_=id=>TD.plans.find(p=>p.id===id);const wd=(new Date().getDay()+6)%7,club=S.club||[],isClub=club.includes(wd),afterClub=club.includes((wd+6)%7);
 const doneWeek=new Set(S.log.filter(l=>daysTo(l.d)>-6).map(l=>l.pid).filter(Boolean)),doneToday=S.log.some(l=>l.d===today()&&l.pid);
 const pickFirst=ids=>ids.map(P_).find(p=>p&&!doneWeek.has(p.id))||P_(ids[0]);

let P=null;
function buildSteps(plan){const st=[];
 plan.blocks.forEach(bl=>{const rounds=bl.rounds||1,circ=/obw|interw/i.test(bl.format||'');
  for(let r=1;r<=rounds;r++)bl.items.forEach(it=>{const e=EX.get(it.ex);if(!e)return;const d={...e.dose,...(it.dose||{})},sets=circ?1:(d.sets||1);

 const refs=[r.low,r.avg,r.good].filter(x=>x!=null);let mn=Math.min(...vals,...refs),mx=Math.max(...vals,...refs);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
 const n=list.length,x=i=>n===1?W/2:L+i*(W-L-Rr)/(n-1),y=v=>top+(1-(v-mn)/(mx-mn))*(H-top-bot);
 let g='';if(r.good!=null)g+=`<line x1="0" x2="${W}" y1="${y(r.good)}" y2="${y(r.good)}" stroke="#f2c14e" stroke-dasharray="4 4" opacity=".7"/><text x="${W-2}" y="${y(r.good)-4}" text-anchor="end" font-size="10" fill="#f2c14e">super</text>`;

 const nb=a.createBuffer(1,Math.floor(a.sampleRate*.08),a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const ns=a.createBufferSource(),ng=a.createGain();ns.buffer=nb;ns.connect(ng);ng.connect(a.destination);ng.gain.value=.22;ns.start(t)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}
let coinT=0;function coin(){if(S.mute)return;if(Date.now()-coinT<400)return;coinT=Date.now();try{const a=actx(),t=a.currentTime;[[988,0],[1319,.08]].forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.1,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+(d?.3:.08));o.start(t+d);o.stop(t+d+.32)})}catch(e){}}

 case'roll':rollWheel();return;
 case'rolldo':if(!ROLL)return;addXP(10);celebrate({img:exImg(ROLL),k:'Koło wyzwań',t:'Brawo!',s:`${ROLL.name} zaliczone. +10 XP`});ROLL=null;break;
 case'tsave':{const t=TD.tests.find(x=>x.id===v),raw=val('tv-'+v).replace(',','.'),num=parseFloat(raw);if(!t||!isFinite(num))return;S.tests=S.tests||[];const prev=S.tests.filter(x=>x.id===v).sort((a,b)=>a.d.localeCompare(b.d)).pop();S.tests.push({id:v,d:today(),v:num});addXP(15);
  const better=prev&&(t.better==='lower'?num<prev.v:num>prev.v);celebrate(better?{vid:'rekord',k:t.name,t:'Nowy rekord!',s:`${String(num).replace('.',',')} ${t.unit} (poprzednio ${String(prev.v).replace('.',',')})`,fan:true}:{img:'tablica',k:t.name,t:String(num).replace('.',',')+' '+t.unit,s:prev?'Zapisane. Następnym razem pobijesz!':'Pierwszy wynik zapisany. +15 XP'});break}
 case'rcol':rcol=+v;document.querySelectorAll('[data-a=rcol]').forEach(x=>x.classList.toggle('on',+x.dataset.v===rcol));document.querySelectorAll('.rcl').forEach(x=>x.textContent=RCOL.find(r=>r[0]===rcol)[3]);return;
 case'addres':{const pre=v,p=rcol,n=val(pre+'n');S.comps.push({d:val(pre+'d')||today(),c:val(pre+'c'),n,p,o:val(pre+'o'),good:val(pre+'g'),fix:val(pre+'f')});if(S.next.d&&S.next.d<=today())S.next={d:'',n:''};addXP(p>=1&&p<=3?30:15);
  celebrate(p===1?{img:'medal',k:n||'Zawody',t:'Złoto!',s:'Mistrzyni. Osu!'}:p>1?{img:'podium',k:n||'Zawody',t:p+'. miejsce!',s:'Medal jest Twój. Brawo!'}:{img:'sou',k:n||'Zawody',t:'Każdy start uczy',s:'Wyciągnij wnioski i wracaj silniejsza. Osu!',conf:false});say(p===1?'Złoto! Mistrzyni!':p>1?'Medal! Brawo!':'Każdy start uczy. Osu!');break}
 case'katahelp':S.kataHelp=1;break;
 case'setbelt':S.cur=i;for(const k in heroEls)heroEls[k]._k='';celebrate({img:'macha',k:'Mój pas',t:S.belts[i].n,s:S.belts[i].k+' – zapisane. Osu!',conf:false});break;
 case'nostripe':S.belts[S.cur].s=null;break;
 case'mute':e.stopPropagation();S.mute=S.mute?0:1;save();if(S.mute){try{speechSynthesis.cancel()}catch(x){}}else mGest=true;sceneMusic();sndSync();if(!S.mute)beep(880,.08);return;
 case'pcount':countGo();return;
 case'feel':S.feel=S.feel||{};S.feel[today()]=+v;say(['','Odpocznij dobrze. Zasłużyłaś!','Odpocznij dzisiaj. Jutro będzie lepiej.','W porządku. Osu!','Super! Tak trzymaj.','Ogień! Jesteś w formie!'][+v]);break;
 case'wkclaim':{S.wk=S.wk||{};const lv=i;S.wk[v]=lv;addXP([5,10,20,30][lv]);const M=[['sou','Starania się liczą!'],['podium','Brązowa odznaka tygodnia!'],['podium','Srebrna odznaka tygodnia!'],['medal','Złota odznaka tygodnia!']][lv];celebrate({img:M[0],k:'Podsumowanie tygodnia',t:M[1],s:`+${[5,10,20,30][lv]} XP. Nowy tydzień, nowa szansa. Osu!`,fan:lv===3});say(M[1]);break}
 case'report':openReport();return;
 case'repx':$('#rep').hidden=true;$('#rep').innerHTML='';return;
 case'repshare':if(REPBLOB)shareBlob(REPBLOB,`raport-${today().slice(0,7)}.png`,'Raport – Droga wojownika');return;
 case'repdl':if(REPBLOB){dlBlob(REPBLOB,`raport-${today().slice(0,7)}.png`);b.textContent='Zapisano w Pobranych'}return;
 case'bkdl':backupBlob().then(bl=>{dlBlob(bl,`droga-wojownika-kopia-${today()}.json`);b.textContent='Zapisano w Pobranych'});return;
 case'bkshare':backupBlob().then(bl=>shareBlob(bl,`droga-wojownika-kopia-${today()}.json`,'Kopia – Droga wojownika'));return;
 case'bkimp':$('#impFile').click();return;
 case'testnotif':testNotif().then(t=>{b.textContent=t});return;
 case'famstart':{const ex=EX.get(val('fx')),goal=Math.max(10,+val('fg')||300),ppl=val('fp').split(',').map(x=>x.trim()).filter(Boolean).slice(0,8);if(!ex||!ppl.length)return;S.fam={wk:weekKey(),ex:ex.id,exn:ex.name,goal,people:ppl.map(n=>({n,v:0})),hist:[],done:0};say(`Wyzwanie rodzinne: ${goal} razy ${ex.name}. Do dzieła!`);break}
 case'famadd':{const F=S.fam;if(!F)return;F.people[i].v+=+v;F.hist.push([i,+v]);if(F.hist.length>50)F.hist.shift();beep(880,.06);const tot=F.people.reduce((a,p)=>a+p.v,0);
  if(!F.done&&tot>=F.goal){F.done=1;addXP(50);celebrate({vid:'rekord',k:'Wyzwanie rodzinne',t:'Cel osiągnięty!',s:`${tot} × ${F.exn} razem. Drużyna wojowników!`,fan:true});say('Cel osiągnięty! Brawo drużyna!')}break}
 case'famundo':{const F=S.fam;const h=F&&F.hist.pop();if(h)F.people[h[0]].v=Math.max(0,F.people[h[0]].v-h[1]);break}
 case'famreset':if(!arm(b))return;S.fam=null;break;
 case'pskip':nextStep();return;
 case'ppause':pausePlay();return;
 case'pquit':{if(!arm(b))return;const m=(Date.now()-P.t0)/60000;closePlay(m>=5);return}
 case'trhome':TR.view='home';keep=false;break;
 case'rec':$('#vidCam').click();return;
 case'gal':$('#vidGal').click();return;
 case'addcomp':{const p=+val('cp'),n=val('cn');S.comps.push({d:val('cd')||today(),c:val('cc'),n,p,o:val('co')});addXP(p>=1&&p<=3?30:15);if(S.next.d&&S.next.d<=today())S.next={d:'',n:''};
  celebrate(p===1?{img:'medal',k:n||'Zawody',t:'Złoto!',s:'Mistrzyni. Osu!'}:p>1?{img:'podium',k:n||'Zawody',t:p+'. miejsce!',s:'Medal jest Twój. Brawo!'}:{img:'sou',k:n||'Zawody',t:'Każdy start uczy',s:'Wyciągnij wnioski i wracaj silniejsza. Osu!',conf:false});break}
 case'delcomp':if(!arm(b))return;S.comps.splice(i,1);break;
 case'sub':e.preventDefault();sub=v;if(tab!=='wiecej'){location.hash='wiecej';return}keep=false;break;
 case'card':{const c=CARDS[i];celebrate({vid:c.vid,img:c.img,k:'Twoja karta',t:c.n,s:c.need,conf:false});return}
 case'addreq':{const t=val('nr');if(!t)return;S.belts[S.cur+1].req.push({t,d:false});break}
 case'delreq':if(!arm(b))return;S.belts[S.cur+1].req.splice(i,1);break;
 case'pass':{if(!arm(b))return;S.cur++;S.passed=(S.passed||0)+1;const nb=S.belts[S.cur];celebrate({vid:'pas',img:'puchar',belt:S.cur,gong:1,k:'Egzamin zdany!',t:nb.n,s:`${nb.k} – nowy pas. Droga trwa. Osu!`});say(`Gratulacje! Nowy pas: ${nb.n}. Osu!`);addXP(100);keep=false;location.hash='start';break}
 case'qstart':qStart();keep=false;break;
 case'qans':Q.ans=i;if(i===Q.list[Q.i].ok){Q.score++;beep(990,.1)}else beep(300,.2);break;
 case'qnext':Q.i++;Q.ans=null;if(Q.i>=10){if(Q.score>S.quizBest)S.quizBest=Q.score;addXP(Q.score*2);celebrate(Q.score===10?{img:'taniec',k:'Quiz',t:'10/10!',s:'Sensei byłby dumny.',fan:true}:Q.score>=7?{img:'macha',k:'Quiz',t:Q.score+'/10',s:'Bardzo dobrze! Jeszcze krok do perfekcji.'}:{img:'smutek',k:'Quiz',t:Q.score+'/10',s:'Spróbuj jeszcze raz, dasz radę!',conf:false})}break;
 case'intro':showIntro();return;
 case'copy':{const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent='Skopiowano'},()=>{document.execCommand('copy');b.textContent='Skopiowano'})}catch(x){try{document.execCommand('copy');b.textContent='Skopiowano'}catch(y){}}return}
 case'imp':{try{const d=JSON.parse(val('im'));if(!d||!d.v||!Array.isArray(d.belts))throw 0;S=d;S.an=S.an||[];S.me=S.me||defMe();if(!Array.isArray(S.got))S.got=CARDS.filter(earned).map(c=>c.id);msg='Kopia wczytana.'}catch(x){msg='To nie wygląda na poprawną kopię.'}break}
 case'reset':if(!arm(b))return;S=fresh();S.got=[];idb.clear();IMG.clear();for(const k in heroEls)heroEls[k]._k='';msg='Dane wyczyszczone.';break;
 default:return;
 }
 checkCards();save();const y=scrollY;render();if(keep)scrollTo(0,y);else scrollTo(0,0);
});

document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;const i=+t.dataset.i;
 if(c==='note')S.kata[i].note=t.value;
 else if(c==='kt'){S.kt[t.dataset.k]=t.type==='checkbox'?(t.checked?1:0):+t.value;if(!T.run&&(T.ph==='idle'||T.ph==='done')){T.ph='idle';T.left=S.kt.w*1000}save();tShow();return}
 else if(c==='rs')S.rs=t.value;else if(c==='rd')S.rd=+t.value;
 else if(c==='nextd'){S.next.d=t.value;save();render();return}
 else if(c==='nextn')S.next.n=t.value;
 else if(c==='cur'){S.cur=+t.value;save();render();return}
 else if(c==='req')S.belts[S.cur+1].req[i].d=t.checked;
 else if(c==='name'){S.name=t.value.trim()||'Blanka'}
 else if(c==='born'){if(t.value)S.born=t.value}
 else if(c==='dedi'){S.dedi=t.value.trim();$('#dedi').textContent=S.dedi}
 else if(c==='me'){S.me[t.dataset.k]=t.value.trim();save();renderProf();return}
 else if(c==='trkata')TR.kata=t.value;
 else if(c==='music'){S.music=t.checked?1:0;mGest=true;save();sceneMusic();render();return}
 else if(c==='mvol'){S.mvol=+t.value;save();if(mEl&&mKey)fadeTo(mEl,mVol(mKey),200);return}
 else if(c==='bag'){if(!S.bag)S.bag={for:S.next.d,ch:{}};S.bag.ch[i]=t.checked;save();render();return}
 else if(c==='acc'){S.accOff=t.checked?0:1;save();render();return}
 else if(c==='beltcol'){S.belts[S.cur].c=t.value;save();render();return}
 else if(c==='beltstr'){S.belts[S.cur].s=t.value;save();render();return}
 else if(c==='voice'){S.voice=t.checked?1:0;save();if(S.voice)say('Osu! Jestem Twoim trenerem.');return}
 else if(c==='remind'){setRemind(t.checked).then(m=>{msg=m;render()});return}
 else if(c==='club'){S.club=(S.club||[]).filter(x=>x!==i);if(t.checked)S.club.push(i);S.club.sort()}
 save()});

const route=()=>{let h=location.hash.slice(1);if(h==='karty'){sub='karty';h='wiecej'}if(h==='trener'){TS.sub='analiza';h='trening'}tab=TABS.some(([k])=>k===h)?h:'start';if(profOpen)closeProf();render();scrollTo(0,0)};
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
